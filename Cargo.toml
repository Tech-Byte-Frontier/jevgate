[package]
name = "jevgate"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "File-scoped maintainability review with TypeSafe Jev"
repository = "https://github.com/Tech-Byte-Frontier/jevgate"
homepage = "https://github.com/Tech-Byte-Frontier/jevgate"
readme = "README.md"
keywords = ["cli", "code-review", "maintainability", "refactoring"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-*", "/NOTICE"]
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
globset = "=0.4.20"
ignore = "=0.4.33"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
rpassword = "=7.5.4"
zeroize = "=1.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.11.0"
toml = "=1.1.5"
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
signal-hook = { version = "=0.4.4", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
secret-service = { version = "=5.2.0", features = ["rt-async-io-crypto-rust"] }
zbus = "=5.19.0"

[profile.dev]
debug = 1

[profile.release]
strip = true
lto = "thin"
