name: Feature request
description: A new rule, language, framework, output format or command
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: For a new rule or framework, an example of the code and the finding you'd expect
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
