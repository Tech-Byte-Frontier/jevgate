name: Release
# Pushing an annotated tag `vX.Y.Z` on main publishes that version: the CI
# checks run first, then the crate goes to crates.io and the tag's message
# body becomes the GitHub release notes. Every step can be rerun safely.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    # crates.io trusts only this workflow in this environment (Trusted Publishing).
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          # Checkout can leave a lightweight copy of the tag; fetch the annotated one.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "$TAG" = "v$version" ] || { echo "::error::Tag $TAG does not match Cargo.toml version $version"; exit 1; }
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || { echo "::error::$TAG must be an annotated tag"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          git tag -l --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::$TAG has no release notes in its message body"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check crates.io
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "jevgate-release (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/jevgate/$VERSION")
          case "$status" in
            200) echo "PUBLISHED=true" >> "$GITHUB_ENV" ;;
            404) echo "PUBLISHED=false" >> "$GITHUB_ENV" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
      - name: Install Rust
        if: env.PUBLISHED == 'false'
        run: rustup toolchain install stable --profile minimal
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: env.PUBLISHED == 'false'
        id: auth
      - name: Publish to crates.io
        if: env.PUBLISHED == 'false'
        run: cargo +stable publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          cat - "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/release.md" <<'EOF'
          ```sh
          cargo install jevgate --locked
          ```

          EOF
          gh release create "$TAG" --verify-tag --latest --title "JevGate $VERSION" --notes-file "$RUNNER_TEMP/release.md"
