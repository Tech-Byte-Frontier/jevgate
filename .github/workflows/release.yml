name: Release
# Pushing an annotated tag `vX.Y.Z` on main publishes that version: the CI
# checks run and the binaries build first, then the crate goes to crates.io and
# the tag's message body becomes the notes of a GitHub release that carries the
# binaries, their checksums and build provenance; then the Homebrew formula in
# Tech-Byte-Frontier/homebrew-tap installs it. Every step can be rerun safely.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    uses: ./.github/workflows/build.yml
  publish:
    needs: [ci, build]
    runs-on: ubuntu-latest
    # crates.io trusts only this workflow in this environment (Trusted Publishing).
    environment: crates-io
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          # Checkout can leave a lightweight copy of the tag; fetch the annotated one.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "$TAG" = "v$version" ] || { echo "::error::Tag $TAG does not match Cargo.toml version $version"; exit 1; }
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || { echo "::error::$TAG must be an annotated tag"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          git tag -l --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::$TAG has no release notes in its message body"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check crates.io
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "jevgate-release (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/jevgate/$VERSION")
          case "$status" in
            200) echo "PUBLISHED=true" >> "$GITHUB_ENV" ;;
            404) echo "PUBLISHED=false" >> "$GITHUB_ENV" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
      - name: Install Rust
        if: env.PUBLISHED == 'false'
        run: rustup toolchain install stable --profile minimal
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: env.PUBLISHED == 'false'
        id: auth
      - name: Publish to crates.io
        if: env.PUBLISHED == 'false'
        run: cargo +stable publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Collect the checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A rerun attaches only the archives a failed run left out.
            present=$(gh release view "$TAG" --json assets -q '.assets[].name')
            for file in dist/*; do
              grep -qxF "$(basename "$file")" <<< "$present" || gh release upload "$TAG" "$file"
            done
            exit 0
          fi
          cat - "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/release.md" <<EOF
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/install.sh | sh
          cargo binstall jevgate   # or: cargo install jevgate --locked
          \`\`\`

          Verify a download with \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`.

          EOF
          gh release create "$TAG" dist/* --verify-tag --latest --title "JevGate $VERSION" --notes-file "$RUNNER_TEMP/release.md"
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The deploy key can write only to the tap.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tech-Byte-Frontier/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - name: Update the Homebrew formula
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          .github/homebrew-formula.sh "${TAG#v}" "$RUNNER_TEMP/SHA256SUMS" > homebrew-tap/Formula/jevgate.rb
          cd homebrew-tap
          if git diff --quiet; then
            echo "The formula already installs $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "jevgate ${TAG#v}"
          git push
