name: JevGate
# JevGate reviews its own pull requests with every rule, as the release
# self-check does. Pull requests from forks and Dependabot get no secrets, so
# they are skipped.
on: pull_request
permissions:
  contents: read
concurrency:
  group: jevgate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Tech-Byte-Frontier/jevgate-action@49d157bab6187e52175c27ed1c89464d48488350 # v1.2.0
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
          args: --rule all --include-tests
