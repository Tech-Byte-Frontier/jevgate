# global-state: a function that both reads and changes state shared by every caller.
# From JevGate's question gallery, which gives how often it was right on real code:
# https://tech-byte-frontier.github.io/jevgate/question-gallery.html#global-state
question = "Does this function both read and change a global, module-level or static variable, or other mutable state shared by every caller?"
background = "State every caller shares couples functions that look independent: results change with call order, tests leak into each other and concurrent calls race. The convention: pass state in and return it, or keep it in an object that owns it."
guidance = "Count: a function that assigns to a variable at the top of a module or package (Python `global`, a JavaScript `let` outside any function, a Go package-level `var`, a Rust `static` behind a lock), a static or class-level field, or a property of `window` or `globalThis`, and also reads it. Not shared state: fields of `self` or `this` in a method; parameters and what they point to; local variables; constants; configuration or environment read without being changed; databases and files; a cache or singleton the function fills once (lazy initialization or memoization); framework per-request objects such as `request`, `g` or a context."
unit = "function"
threshold = 0.8
level = "consider"
next_step = "Pass the state in and return the new state, or move it into an object that owns it."
